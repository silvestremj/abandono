[project]
site_name = "Predicción de Abandono Escolar"
site_description = "Documentación oficial del pipeline de datos y modelos."

language = "es"

[project.theme]
features = [
    "announce.dismiss",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo claro"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

nav = [
    { "Inicio" = "index.md" },
    { "Arquitectura" = "arquitectura.md" },
    { "Referencia del Código" = [
        { "Configuración" = "referencia/configuracion.md" },
        { "Base de Datos" = "referencia/base_datos.md" },
        { "Logs y Trazabilidad" = "referencia/logs.md" },
        { "Ingestor de Datos" = "referencia/ingestor_datos.md" },
        { "Preparador de Datos" = "referencia/preparador_datos.md" },
        { "Analizador de Datos" = "referencia/analizador_datos.md" },
        { "Entrenador de Modelos" = "referencia/entrenador_modelos.md" },
        { "Evaluador de Riesgo" = "referencia/evaluador_riesgo.md" },
        { "Visualizador" = "referencia/visualizador.md" },
        { "Orquestador" = "referencia/orquestador.md" },
    ]},
]
