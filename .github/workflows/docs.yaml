name: Zensical Action
on:
  push:
jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.zensical.outputs.page_url }}
    steps:
      - name: Zensical Action
        id: zensical
        uses: cssnr/zensical-action@v1
        with:
          version: 'latest'
          directory: '.'
          path: 'site'
          upload: 'github-pages'
          deploy: true
